name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # apt 偶尔卡住；留出重试预算（见 install ffmpeg）
    strategy:
      fail-fast: false      # 一个版本挂了不要取消另一个，否则看不到全貌
      matrix:
        node: [20, 22]
    env:
      # 测试自己也会设，但兜一层：不隔离的话 chat.js/window.js 会去摸真实家目录。
      # **不能写 `${{ runner.temp }}`** —— runner 上下文在 job 级 env 里不可用，
      # 整份 workflow 会解析失败（表现是"run 失败但 0 个 job"）。
      #
      # 也**不能加 `DSH_SEE_NO_WINDOW`**：`windowLine()` 会直接返回"被环境变量关掉了"，
      # `visibility.test.mjs` 那 5 条断言全是围绕可见性文案的，会被整片打挂（踩过）。
      DSH_HOME: /tmp/dsh-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install ffmpeg
        # 和 dsh-video-storyboard 同一套：镜像偶尔慢到 180s 都拉不完 62MB 的包。
        # 拆成三次 150s，apt 会复用 /var/cache/apt/archives 里下了一半的 .deb。
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          APT_OPTS="-qq -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo timeout 120s apt-get update $APT_OPTS || sudo timeout 120s apt-get update $APT_OPTS
          for i in 1 2 3; do
            if sudo timeout 150s apt-get install -y --no-install-recommends ffmpeg; then
              break
            fi
            echo "::warning::apt-get install 第 $i 次没在 150s 内装完（已下的包会复用），重试"
          done
          ffmpeg -version | head -1

      - name: syntax check
        run: npm run check:syntax

      - name: unit + e2e tests
        run: npm test

  # 插件的主战场是 Windows（ddagrab/gdigrab/dshow、pythonw 悬浮窗、WASAPI 回环），
  # 但以前 CI 只跑 ubuntu —— pid 回收误杀、rename EPERM、spawn ENOENT 崩宿主这类
  # 只在 Windows 上出事的坑，没有一条能被测出来。
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: isolate DSH_HOME
        # job 级 env 用不了 runner 上下文（见上面 ubuntu job 的注释），只能在 step 里写进 GITHUB_ENV
        shell: pwsh
        run: echo "DSH_HOME=$env:RUNNER_TEMP\dsh-home" >> $env:GITHUB_ENV

      - name: install ffmpeg
        shell: pwsh
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { ffmpeg -version | Select-Object -First 1; exit 0 }
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          ffmpeg -version | Select-Object -First 1
          # 后面的 step 是新进程：把 choco 的 shim 目录显式加进 PATH
          echo "$env:ChocolateyInstall\bin" >> $env:GITHUB_PATH

      - name: syntax check
        run: npm run check:syntax

      - name: unit + e2e tests
        run: npm test
